services:
  - type: web
    name: shadowtrace-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_SOURCE
        value: synthetic
      - key: PYTHON_VERSION
        value: "3.11"
